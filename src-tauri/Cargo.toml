[package]
name = "ilmi"
version = "0.1.1"
description = "incremental reading, cards, and writing over a directory of markdown"
edition = "2021"
rust-version = "1.90"

[lib]
name = "ilmi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
# the http plugin's own client (reqwest, re-exported) also carries the storages (milestone 63): S3 and WebDAV, a
# big file sent and taken as a stream
tauri-plugin-http = { version = "2", features = ["stream"] }
futures-util = { version = "0.3", default-features = false }
# a sign-in's state and PKCE verifier (milestone 64)
getrandom = "0.3"
# the Anki package reader: a zip holding an SQLite database, zstd-compressed in newer exports
zip = { version = "9", default-features = false, features = ["deflate"] }
zstd = "0.14"
rusqlite = { version = "0.40", features = ["bundled", "collation"] }
# the store (milestone 59): a collection is an SQLite file (rusqlite above, its own SQLite built in, which
# builds for iOS); a PDF or an image is a file beside it named by its SHA-256; a blob's collection arrives
# percent-encoded in a header beside the raw bytes
sha2 = "0.10"
percent-encoding = "2"
# the engine (milestone 61): a document's text as the text library keeps it crosses to the renderer in base64
base64 = "0.22"
# the EPUB reader: the package, navigation, and NCX documents are XML
quick-xml = "0.42"
tauri-plugin-deep-link = "2"
# the inspector's `url` row opens a clipped page in the browser
tauri-plugin-opener = "2"
# ink (milestone 58): the PencilKit canvas on iOS, and a drawing read as strokes and drawn as a picture on the Mac too
tauri-plugin-ink = { path = "ink" }
# sync (milestone 53): the vault as a git repository, libgit2 built in; HTTPS with a token, no SSH, no git binary
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2"] }

# a second launch hands its link to the running app; iOS runs one instance by itself (milestone 55)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# iOS: libgit2 speaks TLS through the system there as on the Mac, but git2 still names
# openssl-sys for every unix that is not macOS and a cross build finds none, so it is built in
[target.'cfg(target_os = "ios")'.dependencies]
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }

# Paste and Match Style: the menu item sends the WKWebView `pasteAsPlainText:` (lib.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
