[package]
name = "ilmi"
version = "0.1.0"
description = "incremental reading, cards, and writing over a directory of markdown"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ilmi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
# the Anki package reader: a zip holding an SQLite database, zstd-compressed in newer exports
zip = { version = "9", default-features = false, features = ["deflate"] }
zstd = "0.14"
rusqlite = { version = "0.40", features = ["bundled", "collation"] }
# the EPUB reader: the package, navigation, and NCX documents are XML
quick-xml = "0.42"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# the inspector's `url` row opens a clipped page in the browser
tauri-plugin-opener = "2"

# Paste and Match Style: the menu item sends the WKWebView `pasteAsPlainText:` (lib.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
