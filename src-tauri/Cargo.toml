[package]
name = "ilmi"
version = "0.1.0"
description = "incremental reading, cards, and writing over a directory of markdown"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ilmi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
# the Anki package reader: a zip holding an SQLite database, zstd-compressed in newer exports
zip = { version = "9", default-features = false, features = ["deflate"] }
zstd = "0.14"
rusqlite = { version = "0.40", features = ["bundled", "collation"] }
